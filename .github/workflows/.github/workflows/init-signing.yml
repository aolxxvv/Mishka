
name: Initialize Mishka Debug Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate fixed keystore
        run: |
          keytool -genkeypair -v \
            -keystore mishka-debug.jks \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: Mishka-Debug-Keystore
          path: mishka-debug.jks
          retention-days: 90
