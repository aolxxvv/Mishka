name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Keystore and Base64
        run: |
          keytool -genkey -v -keystore mishka-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mishka -storepass 369111 -keypass 369111 -dname "CN=Mishka, OU=Dev, O=Mishka, L=City, ST=State, C=CN"
          base64 -w 0 mishka-release.jks > base64_key.txt

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: my-signing-key
          path: |
            mishka-release.jks
            base64_key.txt
