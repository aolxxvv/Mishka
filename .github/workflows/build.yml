
name: Build Mishka Debug

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > keystore.jks
          test -s keystore.jks

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-Debug-ARM64
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
