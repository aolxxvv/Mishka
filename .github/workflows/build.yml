name: Build & Security Audit

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Scan APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync upstream tags
        run: git fetch --tags --force https://github.com/YuKongA/Mishka

      # --- 安全检测 1：检查子模块来源与预置二进制 ---
      # --- 安全检测 2：扫描源码中的可疑外联 URL（防偷订阅后门） ---
      - name: Audit Hardcoded URLs in Source
        run: |
          echo "=== 提取 app 源码中的外部网址（排除常见开源/测速域名） ==="
          grep -rnE "https?://[a-zA-Z0-9./?=_-]+" app/src/main/ | grep -vE "github\.com|githubusercontent\.com|gstatic\.com|google\.com|cloudflare\.com|jsdelivr\.net|apache\.org|schemas\.android\.com|yukonga\.top" || true

      # --- 安全检测 2：扫描源码中的可疑外联 URL（防偷订阅后门） ---
      - name: Audit Hardcoded URLs in Source
        run: |
          echo "=== 提取 app 源码中的外部网址（排除常见开源/测速域名） ==="
          grep -rnE "https?://[a-zA-Z0-9./?=_-]+" app/src/main/ \

            | grep -vE "github\.com|githubusercontent\.com|gstatic\.com|google\.com|cloudflare\.com|jsdelivr\.net|apache\.org|schemas\.android\.com|yukonga\.top" || true

      # --- 安全检测 3：Semgrep 静态源码扫描 ---
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/android
            p/secrets

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing key
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > keystore.jks

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # --- 安全检测 4：检查最终 APK 权限 ---
      - name: Audit APK Permissions
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*-arm64-v8a-*.apk" | head -n 1)
          echo "=== 检查生成的 APK 权限列表 ==="
          PERMS=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest permissions "$APK_PATH")
          echo "$PERMS"
          
          # 拦截读取短信、通讯录、无障碍等高危权限
          if echo "$PERMS" | grep -qE "READ_SMS|RECEIVE_SMS|READ_CONTACTS|READ_CALL_LOG|BIND_ACCESSIBILITY_SERVICE"; then
            echo "❌ 警告：检测到异常的高危隐私权限！"
            exit 1
          fi

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          archive: false
