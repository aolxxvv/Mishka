name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-*.apk
          archive: false

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86
          path: app/build/outputs/apk/debug/*-x86-*.apk
          archive: false
